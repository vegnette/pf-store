name = "pf-store-orders"
main = "index.js"
compatibility_date = "2025-01-01"

# Создайте KV-хранилище командой:
#   npx wrangler kv namespace create ORDERS_KV
# и вставьте полученный id сюда.
[[kv_namespaces]]
binding = "ORDERS_KV"
id = "3ed4e74283f24d14bd41fc81fde40fba"

# ID менеджеров можно задать здесь (проще для старта),
# либо секретом: npx wrangler secret put MANAGER_IDS
[vars]
MANAGER_IDS = "5352101935"

# Токен бота НЕ храните в этом файле. Добавьте секретом:
#   npx wrangler secret put BOT_TOKEN
#
# Необязательно: chat_id, куда присылать уведомления о новых заказах.
#   npx wrangler secret put MANAGER_CHAT_ID
#
# Основной бот магазина (для покупателей): его токен нужен, чтобы проверять
# подписи мини-приложения, открытого через этого бота, и присылать уведомления
# о поступлении товара. Задаётся секретом:
#   npx wrangler secret put BOT_TOKEN_MAIN
#
# Ключ для ручного запуска отчёта (POST /run-report, заголовок X-Report-Key):
#   npx wrangler secret put REPORT_KEY

# Ежедневный отчёт в 21:00 по Барнаулу (UTC+7) — это 14:00 UTC.
[triggers]
crons = ["0 14 * * *"]
